<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Defensa de protocolo · Gestión académica con CMMI V3.0 ML2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#050716;--sf:rgba(16,20,52,.68);--fg:#eef0ff;--mu:#aab3dc;--ln:rgba(140,155,255,.28);--ac:#7fe3ff;--a2:#b79cff;--ok:#6dffc2;--wm:#ffb86b;--bd:#ff8aa0;--on:#04101c;--h:250;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#eef1fb;--sf:rgba(255,255,255,.84);--fg:#171b33;--mu:#555d82;--ln:#c4cbe8;--ac:#2a3fcf;--a2:#7a4fd6;--ok:#1a7f4b;--wm:#b8560f;--bd:#c0304a;--on:#fff;color-scheme:light}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.55 Sora,system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-10%;z-index:-2;background:radial-gradient(55% 45% at 12% 8%,rgba(124,92,255,.36),transparent 70%),radial-gradient(45% 40% at 92% 22%,rgba(77,225,255,.22),transparent 70%),radial-gradient(60% 50% at 50% 112%,rgba(255,110,200,.2),transparent 70%);animation:neb 36s ease-in-out infinite alternate}
:root[data-theme=light] body::before{opacity:.35}@keyframes neb{to{transform:scale(1.15) rotate(6deg);filter:hue-rotate(40deg)}}
#sf{position:fixed;inset:0;z-index:-1;pointer-events:none}
#pg{position:fixed;top:0;left:0;height:3px;width:0;z-index:99;background:linear-gradient(90deg,#7fe3ff,#b79cff,#ff8ac8);box-shadow:0 0 14px #7fe3ff;transition:width .5s}
#wp{position:fixed;inset:0;z-index:98;pointer-events:none;opacity:0;background:radial-gradient(circle,transparent 6%,hsla(var(--h),90%,60%,.4) 38%,rgba(5,7,22,.94) 80%)}
#wp.on{animation:wpf .75s ease-in-out}#wp::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(rgba(255,255,255,.7) 0 .35deg,transparent .35deg 3.5deg);-webkit-mask:radial-gradient(circle,transparent 8%,#000 65%);mask:radial-gradient(circle,transparent 8%,#000 65%)}
#wp.on::before{animation:wps .75s cubic-bezier(.5,0,.9,.6)}@keyframes wpf{0%{opacity:0}40%{opacity:1}100%{opacity:0}}@keyframes wps{from{transform:scale(.25) rotate(0)}to{transform:scale(2.4) rotate(30deg)}}
header,footer{display:flex;gap:10px;align-items:center;padding:9px 16px;background:var(--sf);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
header{border-bottom:1px solid var(--ln)}footer{border-top:1px solid var(--ln);justify-content:space-between}
.br{font-weight:800;font-size:.74rem;letter-spacing:.06em;white-space:nowrap;text-shadow:0 0 16px var(--ac)}
#rail{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none}#rail button{white-space:nowrap;font-size:.74rem;padding:4px 11px}
button{font:inherit;color:inherit;cursor:pointer}
.tb,.sb,.b,.oe{background:rgba(127,227,255,.07);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;transition:.25s;color:var(--fg)}
.tb:hover,.sb:hover,.b:hover,.oe:hover{transform:translateY(-2px);box-shadow:0 0 18px rgba(127,227,255,.35);border-color:var(--ac)}
[aria-pressed=true],[aria-current=true]{background:linear-gradient(135deg,var(--ac),var(--a2))!important;color:var(--on)!important;font-weight:700;box-shadow:0 0 22px rgba(127,227,255,.4)}
.b.pri{background:linear-gradient(135deg,var(--ac),var(--a2));color:var(--on);border:0;font-weight:700;padding:10px 22px}
.b:disabled{opacity:.35;pointer-events:none}
main{flex:1;overflow-y:auto;padding:22px clamp(14px,4vw,48px) 30px}
.sl{max-width:1120px;margin:0 auto;display:grid;gap:16px;position:relative;animation:sin .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes sin{0%{opacity:0;transform:scale(.94) translateY(30px);filter:blur(12px) brightness(1.8)}100%{opacity:1;transform:none;filter:none}}
.sl>*{animation:kid .6s backwards;animation-delay:calc(var(--k,0)*90ms + .2s)}@keyframes kid{from{opacity:0;filter:blur(8px);transform:translateY(10px)}}
.sl::before{content:"";position:absolute;right:0;top:-6px;width:54px;height:54px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,hsl(var(--h),90%,78%),hsl(var(--h),70%,38%) 60%,#0a0d26);box-shadow:0 0 30px hsla(var(--h),90%,60%,.6);animation:fl 7s ease-in-out infinite;animation-delay:0s}
.sl::after{content:"";position:absolute;right:-12px;top:12px;width:80px;height:18px;border:2px solid hsla(var(--h),90%,78%,.7);border-radius:50%;transform:rotate(-18deg);pointer-events:none}
@keyframes fl{50%{translate:0 -8px}}@media(max-width:700px){.sl::before,.sl::after{display:none}}
.kick{margin:0 0 4px;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.5rem);line-height:1.12;letter-spacing:-.02em;max-width:22ch;font-weight:800}h3{margin:0 0 6px;font-size:1.02rem}
.lead{color:var(--mu);margin:8px 0 0;max-width:74ch}.mu,small{color:var(--mu)}p{margin:6px 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 36px rgba(0,0,0,.3);min-width:0}
.t,.st{transition:transform .18s ease-out,border-color .3s,box-shadow .3s;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.t:hover,.st:hover,details[open]{border-color:var(--ac);box-shadow:0 0 28px rgba(127,227,255,.22)}
summary{cursor:pointer;font-weight:700}details p{margin-top:10px;color:var(--mu)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.st{display:flex;flex-direction:column;gap:2px}.st b{font:800 clamp(1.5rem,3.5vw,2.2rem)/1.1 Sora,sans-serif;color:var(--ac);text-shadow:0 0 20px rgba(127,227,255,.5)}.st span{font-size:.8rem;color:var(--mu)}
.big{font-size:clamp(1.9rem,5.5vw,3.5rem);max-width:19ch;background:linear-gradient(120deg,var(--fg),var(--ac) 50%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.q{border-left:3px solid var(--a2)}.q p{font-size:1.12rem;margin:4px 0 0}
.tabs{display:grid;gap:12px}.tbs{display:flex;gap:8px;flex-wrap:wrap}.tp[hidden]{display:none}.tp{animation:kid .4s}
.route .tbs{flex-wrap:nowrap;overflow-x:auto;padding:4px 2px}.route .tb{border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px;font-size:.72rem;line-height:1.2}.route .tb i{font:700 1.1rem 'IBM Plex Mono',monospace;font-style:normal}
.col .tbs{flex-direction:column}.col .tb{border-radius:14px;text-align:left;padding:14px 16px}
.gantt .tbs{flex-direction:column;flex-wrap:nowrap;gap:6px}.gantt .tb{display:grid;grid-template-columns:70px 1fr;gap:10px;border-radius:12px;text-align:left;padding:8px 12px;align-items:center}
.trk{position:relative;height:12px;border-radius:6px;background:rgba(127,140,255,.18)}.trk i{position:absolute;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--a2))}.gantt [aria-pressed=true] .trk i{background:var(--on)}
.rw{display:grid;grid-template-columns:minmax(120px,1.3fr) 3fr 52px;gap:10px;align-items:center;font-size:.88rem;margin:8px 0}.rw b{text-align:right;font-family:'IBM Plex Mono',monospace}
.bar{height:12px;border-radius:6px;background:rgba(127,140,255,.18);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--ac),var(--a2));transition:width .9s cubic-bezier(.2,.8,.2,1)}.bar i.w{background:linear-gradient(90deg,var(--ok),var(--ac))}
input[type=range]{width:100%;accent-color:var(--ac)}input[type=text]{flex:1;min-width:150px;background:rgba(127,227,255,.07);border:1px solid var(--ln);border-radius:999px;padding:7px 14px;color:var(--fg);font:inherit}
.wl{display:grid;grid-template-columns:minmax(120px,1.4fr) 2fr 34px;gap:10px;align-items:center;font-size:.84rem}
ul{margin:6px 0;padding-left:20px;display:grid;gap:4px}.chip{display:inline-block;border-radius:99px;padding:1px 10px;font:600 .72rem 'IBM Plex Mono',monospace;border:1px solid var(--ln);margin-right:6px}
.A{color:var(--ok);border-color:var(--ok)}.M{color:var(--wm);border-color:var(--wm)}.B{color:var(--mu)}
.oe{border-radius:16px;text-align:left;display:block;width:100%}.oe b{font:700 .8rem 'IBM Plex Mono',monospace;color:var(--ac)}.oe small{color:var(--ac)}
.fl{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;text-align:center}.fl .card{padding:10px 16px;font-size:.84rem}.fl span.ar{color:var(--ac);font-size:1.2rem}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}.dots button{width:9px;height:9px;padding:0;border-radius:50%;background:var(--ln);border:0}.dots [aria-current=true]{width:22px;border-radius:5px}
.hint{font-size:.7rem;color:var(--mu)}@media(max-width:700px){.hint{display:none}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="sf"></canvas><div id="pg"></div><div id="wp"></div>
<header><span class="br">DEFENSA DE PROTOCOLO</span><nav id="rail" aria-label="Capítulos"></nav><button class="b" id="th" aria-label="Cambiar tema">◐</button></header>
<main id="st"></main>
<footer><button class="b" id="pv">←</button><div class="dots" id="dots"></div><span class="hint" id="ct"></span><button class="b pri" id="nx">→</button></footer>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const R=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];
const N=['Portada','Introducción','Antecedentes','Justificación','Objetivos','Marco teórico','Hipótesis','Diseño metodológico','Diagnóstico','Diseño del sistema','Implementación','Verificación','Evaluación y mejora','Cronograma','Bibliografía','Anexos','Cierre'];
const S=[],add=(n,t,f,i)=>S.push({n,t,f,i});
const H=(n,t,l)=>`<div><p class="kick">${n&&n<16?'Capítulo '+R[n]+' · ':''}${N[n]}</p><h1>${t}</h1>${l?`<p class="lead">${l}</p>`:''}</div>`;
const DT=(t,b)=>`<details class="card t"><summary>${t}</summary><p>${b}</p></details>`;
const TB=(it,c='')=>`<div class="tabs ${c}"><div class="tbs">${it.map((x,i)=>`<button class="tb" aria-pressed="${i==0}">${x[0]}</button>`).join('')}</div>${it.map((x,i)=>`<div class="tp card"${i?' hidden':''}>${x[1]}</div>`).join('')}</div>`;
const ul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const bars=(r,m)=>r.map(x=>`<div class="rw"><span>${x[0]}</span><div class="bar"><i class="${x[2]||''}" data-w="${x[1]/m*100}%"></i></div><b>${x[1]}</b></div>`).join('');
const fit=r=>$$('[data-w]',r).forEach(b=>{b.style.width=0;requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=b.dataset.w))});
const cu=(e,to)=>{if(RM){e.textContent=to;return}const t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/1200);e.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
const fmt=n=>n.toLocaleString('en-US'),fd=s=>s.split('-').reverse().join('/');

/* ---------- Capítulos I–IV ---------- */
add(0,'Portada',()=>`<div><p class="kick">Defensa de protocolo · Colegio Bautista Camino de Vida</p><h1 class="big">Sistema web de gestión académica bajo CMMI V3.0, Nivel de Madurez 2</h1><p class="lead">Matrícula, calificaciones, conducta, aulas y expediente estudiantil, construidos con un proceso planificado, medido y controlado.</p></div><div class="grid g4">${[[7,'fases CMMI'],[9,'sprints (0 a 8)'],[44,'requerimientos'],[18,'usuarios del colegio']].map(x=>`<div class="card st"><b data-n="${x[0]}">0</b><span>${x[1]}</span></div>`).join('')}</div><p class="mu">Equipo: Engel Barahona · Leonardo Díaz · Sleyter Conde<br>Product Owner y patrocinadora: Lidia Escobar, Directora del colegio</p><div><button class="b pri" data-go="1">Iniciar defensa →</button></div>`);
add(1,'Introducción',()=>H(1,'Del papel a un proceso gestionado','El colegio lleva sus procesos académicos en formato físico u hojas de cálculo, lo que eleva la carga laboral de sus colaboradores.')+`<div class="card q"><small>Pregunta de investigación</small><p>¿Cuál es el impacto de desarrollar un sistema web de gestión académica bajo las prácticas del nivel de madurez 2 de CMMI V3.0 en la eficiencia de los procesos administrativos del colegio y en el control del propio proceso de desarrollo?</p></div><div class="grid g3">${DT('El problema','Matrícula, notas y conducta en papel u hojas de cálculo: duplicidad de esfuerzo, errores y sobrecarga del personal administrativo y docente.')}${DT('La propuesta','Un sistema web en línea para la directora, el personal administrativo y los docentes. Scrum organiza el trabajo técnico y CMMI aporta el marco de gobierno.')}${DT('El alcance','Primaria y secundaria, acceso solo por rol, y CMMI V3.0 hasta el Nivel de Madurez 2. Los niveles superiores quedan fuera.')}</div>`);
add(2,'Antecedentes',()=>H(2,'Lo que existe y lo que falta','Haz clic en cada tarjeta para ver el detalle.')+`<div class="grid g2">${DT('Situación actual','Desde su fundación, expedientes, historial académico y registro de conducta se llevan en formato físico. Con cada ciclo de matrícula crecen la carga laboral, la duplicidad y los errores.')}${DT('Alternativas comerciales','Q10 y Classter son plataformas de pago por suscripción: una inversión constante para la institución.')}${DT('Trabajos nacionales','Padilla Reyes et al. (2012), García Hernández et al. (2016), Murillo Blandón et al. (2025, desplegado en AWS) y Dávila Ojeda et al. (2025, interfaces intuitivas). Son de uso privado y no pueden adoptarse directamente.')}${DT('Lo que diferencia a este proyecto','Además de construir el producto, pone el énfasis en el proceso: CMMI V3.0 como ruta metodológica para un desarrollo planificado, medido y controlado, con ML2 como meta.')}</div>`);
add(3,'Justificación',()=>H(3,'Tres necesidades del colegio')+`<div class="grid g3">${DT('1 · Gestión estudiantil','Hoy es manual: aumenta la posibilidad de errores en matrícula, notas y conducta, y con ello la carga de trabajo.')}${DT('2 · Sobrecarga laboral','Docentes y administrativos dedican tiempo considerable a registro, consolidación y reportes repetitivos.')}${DT('3 · Proceso ordenado','El sistema debe poder mantenerse y evolucionar sin depender del conocimiento informal de cada integrante.')}</div><div class="card"><h3>Resultados esperados</h3>${ul(['Interfaces intuitivas y expediente estudiantil centralizado, con reportes de notas, asistencia y conducta.','Protección de datos conforme a la Ley N.º 787: control de acceso por roles y cifrado.','ML2 aporta planificación documentada, gestión de requerimientos y de la configuración, aseguramiento de calidad y medición básica.','Base para matrículas en línea y para una progresión posterior a niveles superiores de madurez.'])}</div>`);
const OE=[['Diagnosticar','la situación actual de los procesos académicos y del proceso de desarrollo frente a CMMI V3.0, y recopilar los requerimientos.',8],['Diseñar','la estructura y funcionalidades del sistema: matrícula, calificaciones, conducta, aulas y horarios, y expediente.',9],['Implementar','el sistema en fases progresivas con sprints de Scrum enmarcados en las fases CMMI y las prácticas de ML2.',10],['Verificar','la calidad con pruebas, revisiones entre pares y auditorías de proceso, con docentes y personal administrativo.',11],['Evaluar','la eficiencia del sistema y el cumplimiento de ML2, con un mecanismo de mejora continua.',12]];
add(4,'Objetivos',()=>H(4,'Un objetivo general y cinco específicos','Cada objetivo específico corresponde a un capítulo de desarrollo. Haz clic para saltar a él.')+`<div class="card q"><small>Objetivo general</small><p>Desarrollar un sistema web de gestión académica en línea que facilite la organización escolar y apoye el trabajo de la directora, el personal administrativo y los docentes, aplicando CMMI V3.0 para alcanzar el Nivel de Madurez 2 en el proceso de desarrollo.</p></div><div class="grid g3">${OE.map((o,i)=>`<button class="oe t" data-ch="${o[2]}"><b>OE${i+1}</b><h3>${o[0]}</h3><p class="mu">${o[1]}</p><small>Capítulo ${R[o[2]]} →</small></button>`).join('')}</div>`);

/* ---------- Capítulos V–VII ---------- */
add(5,'Marco teórico',()=>H(5,'Seis pilares conceptuales','Selecciona un pilar.')+TB([['Scrum + CMMI','<p>Scrum organiza el trabajo en sprints de 2 a 3 semanas; <b>CMMI V3.0</b> (ISACA, 2023) aporta el gobierno del proceso. Se complementa con prácticas selectas de RUP e ingeniería ágil: pruebas, integración continua y revisiones entre pares.</p>'],['Nivel de Madurez 2','<p><b>Gestionado:</b> los proyectos se planifican, ejecutan, miden y controlan según una política definida.</p><p class="mu">Áreas del alcance: PLAN, EST, MC, RDM, CM, PQA, VV, PR, RSK, TS, PI, GOV e II.</p>'],['Arquitectura','<p>Modelo de <b>tres capas</b>: presentación, lógica de negocio y datos. Cada capa interactúa solo con la adyacente y se desarrolla de forma independiente. La seguridad es transversal.</p>'],['Stack y herramientas',ul(['Backend: Python y <b>Django</b>.','Datos: <b>PostgreSQL</b> con ORM.','Frontend: HTML, JavaScript y <b>Tailwind CSS</b>; comunicación por APIs RESTful.','Apoyo: Google Forms, Draw.io, Trello y Git.'])],['Seguridad y datos',ul(['<b>Ley N.º 787</b> de Protección de Datos Personales y Ley N.º 1042 contra el acceso no autorizado.','Confidencialidad, integridad y disponibilidad.','Cifrado HTTPS y bcrypt, control de acceso por roles y bitácora de auditoría.'])],['Medición','<p><b>GQM</b> (objetivo → pregunta → métrica) para derivar indicadores; <b>SUS</b> (Brooke, 1996) para usabilidad con meta ≥ 70/100; <b>COCOMO</b> para estimar esfuerzo y duración; registro de riesgos con probabilidad, impacto y respuesta.</p>']]));
add(6,'Hipótesis',()=>H(6,'La hipótesis y sus tres variables')+`<div class="card q"><small>Hipótesis</small><p>La implementación de un sistema de gestión académica en línea, desarrollado bajo las prácticas del Nivel de Madurez 2 de CMMI V3.0, incrementa significativamente la eficiencia administrativa del colegio y permite que el proceso de desarrollo sea gestionado: planificado, medido y controlado.</p></div>`+TB([['Uso del sistema','<p>Sistema web con módulos de <b>matrícula, registro de notas, conducta, aulas y horarios, y expediente estudiantil</b>, usado por la directora, el personal administrativo y los docentes según su rol.</p>'],['Eficiencia administrativa',ul(['Reducción del tiempo de trámites: matrícula, notas y reportes.','Disminución de errores: inconsistencias, duplicidad y retrasos.','Satisfacción del personal con encuestas y escala SUS (meta ≥ 70/100).'])],['Madurez del proceso (ML2)',ul(['% de prácticas de las áreas del alcance con evidencia.','% de requerimientos con trazabilidad hasta pruebas.','Cumplimiento del plan de sprints.','Defectos detectados y corregidos por sprint.'])]]));
add(7,'Diseño metodológico',()=>H(7,'Un estudio mixto, de ciencia del diseño','Se construye y mejora un sistema real para una necesidad real, con Scrum, arquitectura en capas y CMMI V3.0 como marco de gobierno.')+`<div class="grid g3"><div class="card st"><span>Tipo</span><b>Causal</b></div><div class="card st"><span>Enfoque</span><b>Mixto</b></div><div class="card st"><span>Estrategia</span><b>Ciencia del diseño</b></div></div><div class="grid g4">${[[18,'colaboradores (censo): 15 docentes y 3 administrativos'],[9,'informantes clave: 1 directora, 7 docentes, 1 administrativo'],[95,'% de confianza (muestra calculada ≈ 17)'],[5,'% de margen de error']].map(x=>`<div class="card st"><b data-n="${x[0]}">0</b><span>${x[1]}</span></div>`).join('')}</div><div class="card"><h3>Roles del equipo</h3>${ul(['<b>Product Owner y patrocinadora:</b> Lidia Escobar, Directora.','<b>Scrum Master:</b> Engel Barahona.','<b>Equipo de desarrollo:</b> Engel Barahona, Leonardo Díaz y Sleyter Conde.','<b>Comité de Dirección de Calidad (CDC):</b> equipo de desarrollo y Dirección del colegio.'])}</div>`);

addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key;if(k=='ArrowRight'||k=='PageDown'||k==' ')e.preventDefault(),go(cur+1);else if(k=='ArrowLeft'||k=='PageUp')go(cur-1);else if(k=='Home')go(0);else if(k=='End')go(S.length-1);else if(k=='f'||k=='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}else if(k=='t'||k=='T')$('#th').click()});
